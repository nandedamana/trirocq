# Template copied from https://github.com/rocq-prover/docker-opam-action
# Split to get a separate badge for each Rocq version;
# see https://github.com/orgs/community/discussions/52616

name: CI

on:
  workflow_call:
    inputs:
      coq_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest  # container actions require GNU/Linux
    strategy:
      matrix:
        coq_version:
          - ${{ inputs.coq_version }}
        ocaml_version: ['default']
      fail-fast: false  # don't stop jobs if one fails
    steps:
      - uses: actions/checkout@v3
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'trirocq.opam'
          coq_version: ${{ matrix.coq_version }}
          ocaml_version: ${{ matrix.ocaml_version }}
          # dune pinned to 3.17.2 by default, but I need support for rocq lang
          before_install: |
            opam pin remove dune --no-action
